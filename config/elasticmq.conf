include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/fides-queues"
}

auto-create-queues {
  enabled = false
}

queues {
  fides-background-jobs {
    defaultVisibilityTimeout = 5 seconds
    receiveMessageWait = 1 second
    deadLettersQueue {
      name = "fides-background-jobs-dlq"
      maxReceiveCount = 3
    }
  }

  fides-background-jobs-dlq { }
}
