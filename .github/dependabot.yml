# Actualizaciones semanales de dependencias de Fides.
#
# El objetivo es poco ruido: los cambios menores y de parche llegan agrupados en
# una sola propuesta y sólo los cambios mayores se revisan uno por uno.

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 4
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Next y React se fijan a versiones exactas y se mueven juntos.
      next-y-react:
        patterns:
          - next
          - "@next/*"
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Una sola propuesta con todo el utillaje de desarrollo.
      desarrollo:
        dependency-type: development
        update-types:
          - minor
          - patch
      produccion:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns:
          - "*"

  # Imágenes base del `Dockerfile` (node:22-alpine) y de la pila local.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      imagenes:
        patterns:
          - "*"
